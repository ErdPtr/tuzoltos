<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Tűzoltó</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Share Tech Mono',monospace;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        #wrap {
            position: relative;
            border: 2px solid #ff6600;
            box-shadow: 0 0 50px #ff660033, 0 0 100px #ff220011;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

            #overlay h1 {
                font-family: 'Black Han Sans',sans-serif;
                font-size: 80px;
                letter-spacing: 6px;
                color: #ff4400;
                text-shadow: 0 0 40px #ff4400aa,0 0 80px #ff220055;
                line-height: 1;
                text-align: center;
            }

        #startBtn {
            background: #ff4400;
            border: none;
            color: #fff;
            font-family: 'Black Han Sans',sans-serif;
            font-size: 28px;
            letter-spacing: 4px;
            padding: 12px 48px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 20px #ff440066;
        }

            #startBtn:hover {
                background: #ff6600;
                box-shadow: 0 0 40px #ff6600;
            }

        #scoreBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.75);
            pointer-events: none;
            border-bottom: 1px solid #ff440055;
        }

        .sb {
            font-family: 'Black Han Sans',sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
        }

            .sb .val {
                color: #ff8800;
            }

            .sb .lbl {
                color: #776;
                font-size: 13px;
                font-family: 'Share Tech Mono',monospace;
            }

        #hint {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #554;
            pointer-events: none;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <canvas id="c" width="800" height="560"></canvas>
        <div id="scoreBar">
            <div class="sb"><div class="lbl">PONT</div><div class="val" id="hScore">0</div></div>
            <div class="sb"><div class="lbl">ÉLET</div><div class="val" id="hLives">♥♥♥</div></div>
            <div class="sb"><div class="lbl">KÖR</div><div class="val" id="hWave">1</div></div>
            <div class="sb"><div class="lbl">MENTETT</div><div class="val" id="hRescued">0</div></div>
        </div>
        <div id="hint">A / D — MOZGÁS &nbsp;|&nbsp; E tartva — OLTÁS (szomszédos tűznél)</div>
        <div id="overlay">
            <h1>TŰZOLTÓ</h1>
            <button id="startBtn" onclick="startGame()">INDÍTÁS!</button>
        </div>
    </div>

    <script>
        const C = document.getElementById('c');
        const ctx = C.getContext('2d');
        const W = 800, H = 560;

        const COLS = 8;
        const GROUND_Y = H - 72;
        const GRID_W = W / COLS;
        const PLAYER_Y = GROUND_Y + 4;

        function gx(i) { return i * GRID_W + GRID_W / 2; }

        let state;
        function fresh() {
            return {
                player: { col: 0, x: gx(0), targetX: gx(0) },
                grid: Array.from({ length: COLS }, () => ({ fire: 0 })),
                fallers: [],
                score: 0, lives: 3, wave: 1, rescued: 0,
                waveTimer: 0, nextSpawn: 2.5,
                spawnCount: 0, spawnPerWave: 6,
                waveComplete: false,
                gameOver: false,
                particles: [],
                fallerIdCounter: 0,
                flashMsg: null, flashTimer: 0, flashColor: '#fff'
            };
        }
        state = fresh();
        let gameActive = false;
        let keys = {};
        let t = 0, lastTs = 0;

        document.addEventListener('keydown', e => {
            if (!keys[e.key]) {
                keys[e.key] = true;
                if (gameActive && (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')) movePlayer(-1);
                if (gameActive && (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight')) movePlayer(1);
            }
            e.preventDefault();
        });
        document.addEventListener('keyup', e => { keys[e.key] = false; });

        function movePlayer(dir) {
            const s = state;
            const nc = Math.max(0, Math.min(COLS - 1, s.player.col + dir));
            if (s.grid[nc].fire > 0) return;
            s.player.col = nc;
            s.player.targetX = gx(nc);
        }

        function spawnFaller() {
            const s = state;
            const expChance = Math.min(0.25, 0.05 + s.wave * 0.03);
            const personChance = 0.45 - s.wave * 0.02;
            const r = Math.random();
            let type = r < personChance ? 'person' : (r < personChance + expChance ? 'explosive' : 'debris');

            const occupied = new Set(s.fallers.filter(f => f.state === 'falling').map(f => f.col));
            let col;
            let tries = 0;
            do { col = Math.floor(Math.random() * COLS); tries++; } while (occupied.has(col) && tries < 20);

            const baseVy = 60 + s.wave * 15;
            s.fallers.push({
                type, col,
                x: gx(col),
                y: 70 + Math.random() * 30,
                vy: baseVy + Math.random() * 20,
                state: 'falling',
                timer: 0,
                id: s.fallerIdCounter++,
                wiggle: (Math.random() - 0.5) * 0.5
            });
        }

        function update(dt) {
            const s = state;
            t += dt;

            s.player.x += (s.player.targetX - s.player.x) * Math.min(1, dt * 18);

            if (!s.waveComplete) {
                s.waveTimer += dt;
                s.nextSpawn -= dt;
                if (s.nextSpawn <= 0 && s.spawnCount < s.spawnPerWave) {
                    spawnFaller();
                    s.spawnCount++;
                    s.nextSpawn = Math.max(0.8, 2.2 - s.wave * 0.15) + Math.random() * 0.8;
                }
                if (s.spawnCount >= s.spawnPerWave && s.fallers.every(f => f.state === 'done')) {
                    s.waveComplete = true;
                    s.flashMsg = `${s.wave}. KÖR TELJESÍTVE!`;
                    s.flashColor = '#ffcc44';
                    s.flashTimer = 2.5;
                    setTimeout(() => {
                        s.wave++;
                        s.spawnCount = 0;
                        s.spawnPerWave = 6 + s.wave * 2;
                        s.nextSpawn = 1.5;
                        s.waveComplete = false;
                        s.fallers = [];
                    }, 2500);
                }
            }

            for (const f of s.fallers) {
                if (f.state === 'falling') {
                    f.y += f.vy * dt;
                    f.x = gx(f.col) + Math.sin(t * 2 + f.id) * (f.type === 'person' ? 4 : 1);

                    if (f.y >= GROUND_Y - 10) {
                        f.y = GROUND_Y - 10;
                        if (f.type === 'person') {
                            if (s.player.col === f.col) {
                                f.state = 'done';
                                s.score += 200;
                                s.rescued++;
                                spawnBurst(f.x, GROUND_Y, '#88ccff', 20);
                                flash('MEGMENTVE! +200', '#88ccff');
                            } else {
                                f.state = 'done';
                                s.lives--;
                                spawnBurst(f.x, GROUND_Y, '#ff4444', 15);
                                flash('ELVESZETT! -1 ÉLET', '#ff4444');
                                if (s.lives <= 0) { endGame(false); }
                            }
                        } else if (f.type === 'debris') {
                            f.state = 'landed';
                            f.timer = 0;
                            s.grid[f.col].fire = 1.0;
                            spawnBurst(f.x, GROUND_Y, '#ff8800', 12);
                        } else if (f.type === 'explosive') {
                            f.state = 'primed';
                            f.timer = 1.8;
                            spawnBurst(f.x, GROUND_Y, '#ff4400', 10);
                        }
                    }
                }

                if (f.state === 'primed') {
                    f.timer -= dt;
                    if (f.timer <= 0) {
                        f.state = 'exploding';
                        f.timer = 0.6;
                        spawnExplosion(gx(f.col), GROUND_Y, f.col);
                    }
                }

                if (f.state === 'exploding') {
                    f.timer -= dt;
                    if (f.timer <= 0) f.state = 'done';
                }

                if (f.state === 'landed') {
                    if (s.grid[f.col].fire <= 0) f.state = 'done';
                }
            }

            if ((keys['e'] || keys['E']) && gameActive) {
                const pc = s.player.col;
                for (let c = Math.max(0, pc - 1); c <= Math.min(COLS - 1, pc + 1); c++) {
                    if (s.grid[c].fire > 0) {
                        s.grid[c].fire -= dt * 0.55;
                        if (s.grid[c].fire < 0) { s.grid[c].fire = 0; s.score += 50; }
                    }
                }
            }

            for (let c = 0; c < COLS; c++) {
                if (s.grid[c].fire > 0) s.grid[c].fire = Math.min(2.0, s.grid[c].fire + dt * 0.04);
            }

            for (let i = s.particles.length - 1; i >= 0; i--) {
                const p = s.particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt;
                if (p.life <= 0) s.particles.splice(i, 1);
            }

            if (s.flashTimer > 0) s.flashTimer -= dt;

            document.getElementById('hScore').textContent = s.score;
            document.getElementById('hLives').textContent = '♥'.repeat(Math.max(0, s.lives)) + '♡'.repeat(Math.max(0, 3 - s.lives));
            document.getElementById('hWave').textContent = s.wave;
            document.getElementById('hRescued').textContent = s.rescued;
        }

        function spawnExplosion(x, y, col) {
            const s = state;
            for (let c = Math.max(0, col - 1); c <= Math.min(COLS - 1, col + 1); c++) {
                s.grid[c].fire = 1.5;
            }
            spawnBurst(x, y, '#ff4400', 35);
            spawnBurst(x, y, '#ffcc00', 20);
            for (let i = 0; i < 60; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 80 + Math.random() * 300;
                s.particles.push({
                    x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 200,
                    life: 0.5 + Math.random() * 0.8, maxLife: 1.3,
                    r: 3 + Math.random() * 6,
                    col: `rgba(${Math.random() < 0.5 ? '255,100,0' : '255,200,50'},`
                });
            }
            flash('BUMM!', '#ff4400');
        }

        function spawnBurst(x, y, col, count) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 30 + Math.random() * 120;
                state.particles.push({
                    x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 80,
                    life: 0.3 + Math.random() * 0.5, maxLife: 0.8,
                    r: 2 + Math.random() * 4,
                    col: col.startsWith('#') ? hexToRgba(col) : col
                });
            }
        }

        function hexToRgba(h) {
            const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
            return `rgba(${r},${g},${b},`;
        }

        function flash(msg, col) {
            state.flashMsg = msg;
            state.flashColor = col || '#fff';
            state.flashTimer = 1.5;
        }

        function endGame(won) {
            state.gameOver = true;
            gameActive = false;
            const ol = document.getElementById('overlay');
            ol.style.display = 'flex';
            ol.innerHTML = `
        <h1 style="color:${won ? '#88ff44' : '#ff4400'};font-size:60px">${won ? 'VÁROS\nMEGMENTVE' : 'JÁTÉK\nVÉGE'}</h1>
        <div style="font-size:12px;color:#ff8844;letter-spacing:2px;text-transform:uppercase">${won ? 'Minden kör teljesítve!' : 'A város rád számított...'}</div>
        <div style="background:#111;border:1px solid #ff4400;padding:16px 24px;font-size:13px;line-height:2.2;color:#ccc;text-align:center">
          Végső pont: <span style="color:#ff8800;font-size:20px">${state.score}</span><br>
          Mentett személyek: <span style="color:#88ccff">${state.rescued}</span><br>
          Elért kör: <span style="color:#ff8800">${state.wave}</span>
        </div>
        <button id="startBtn" style="background:#ff4400;border:none;color:#fff;font-family:'Black Han Sans',sans-serif;font-size:28px;letter-spacing:4px;padding:12px 48px;cursor:pointer;box-shadow:0 0 20px #ff440066;" onclick="startGame()">ÚJRA!</button>
      `;
        }

        const BLDG = {
            x: 100, y: 30, w: 600, h: GROUND_Y - 30,
            wCols: 8, wRows: 12,
            wPadX: 18, wPadY: 12, wW: 48, wH: 22
        };

        const winLit = Array.from({ length: BLDG.wRows }, () =>
            Array.from({ length: BLDG.wCols }, () => Math.random() < 0.35)
        );

        function draw() {
            ctx.clearRect(0, 0, W, H);
            drawSky();
            drawBuilding();
            drawGroundGrid();
            drawFires();
            drawFallers();
            drawPlayer();
            drawParticles();
            drawHUD();
        }

        function drawSky() {
            const gr = ctx.createLinearGradient(0, 0, 0, H);
            gr.addColorStop(0, '#060c18');
            gr.addColorStop(1, '#0e1520');
            ctx.fillStyle = gr;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for (let i = 0; i < 80; i++) {
                const sx = ((i * 137) % W);
                const sy = ((i * 97) % (GROUND_Y - 60));
                const blink = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.8 + i));
                ctx.globalAlpha = blink * 0.6;
                ctx.fillRect(sx, sy, 1, 1);
            }
            ctx.globalAlpha = 1;
        }

        function drawBuilding() {
            const b = BLDG;
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(b.x + 8, b.y + 8, b.w, b.h);
            const bgr = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0);
            bgr.addColorStop(0, '#161e2c');
            bgr.addColorStop(0.5, '#1e2a3a');
            bgr.addColorStop(1, '#141c28');
            ctx.fillStyle = bgr;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#253040';
            ctx.lineWidth = 1;
            const floorH = b.h / b.wRows;
            for (let r = 0; r <= b.wRows; r++) {
                ctx.beginPath();
                ctx.moveTo(b.x, b.y + r * floorH);
                ctx.lineTo(b.x + b.w, b.y + r * floorH);
                ctx.stroke();
            }
            ctx.strokeStyle = '#2a3a50';
            ctx.lineWidth = 3;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#253045';
            ctx.fillRect(b.x - 10, b.y, b.w + 20, 12);
            ctx.fillStyle = '#1a2234';
            ctx.fillRect(b.x + b.w / 2 - 20, b.y - 30, 40, 32);
            ctx.fillRect(b.x + b.w / 2 - 5, b.y - 50, 10, 22);
            const wStartX = b.x + (b.w - b.wCols * (b.wW + b.wPadX) + b.wPadX) / 2;
            const wStartY = b.y + 20;
            for (let r = 0; r < b.wRows; r++) {
                for (let c = 0; c < b.wCols; c++) {
                    const wx = wStartX + c * (b.wW + b.wPadX);
                    const wy = wStartY + r * (b.wH + b.wPadY);
                    const lit = winLit[r][c];
                    const flicker = lit && Math.sin(t * 3.5 + r * 1.7 + c * 2.3) > 0.95;
                    ctx.fillStyle = flicker ? '#ffe9a0' : (lit ? '#ffe080' : '#0d1520');
                    ctx.fillRect(wx, wy, b.wW, b.wH);
                    ctx.strokeStyle = '#2a3a50';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(wx, wy, b.wW, b.wH);
                    ctx.beginPath();
                    ctx.moveTo(wx + b.wW / 2, wy); ctx.lineTo(wx + b.wW / 2, wy + b.wH);
                    ctx.moveTo(wx, wy + b.wH / 2); ctx.lineTo(wx + b.wW, wy + b.wH / 2);
                    ctx.stroke();
                    if (lit && !flicker) {
                        ctx.fillStyle = 'rgba(255,220,100,0.04)';
                        ctx.fillRect(wx - 2, wy - 2, b.wW + 4, b.wH + 4);
                    }
                }
            }
        }

        function drawGroundGrid() {
            ctx.fillStyle = '#111115';
            ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
            ctx.fillStyle = '#1a1a20';
            ctx.fillRect(0, GROUND_Y, W, 8);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y + 2);
            ctx.lineTo(W, GROUND_Y + 2);
            ctx.stroke();
            for (let c = 0; c < COLS; c++) {
                const x = c * GRID_W;
                const isHot = state.grid[c].fire > 0;
                if (isHot) {
                    const alpha = Math.min(0.4, state.grid[c].fire * 0.2);
                    ctx.fillStyle = `rgba(255,80,0,${alpha})`;
                    ctx.fillRect(x + 1, GROUND_Y, GRID_W - 2, H - GROUND_Y);
                }
                ctx.strokeStyle = '#2a2a3a';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x, H);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#33334a';
                ctx.font = '10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(c + 1, x + GRID_W / 2, H - 4);
            }
            for (let c = 0; c < COLS; c++) {
                ctx.fillStyle = state.player.col === c ? 'rgba(255,200,100,0.15)' : 'rgba(255,255,255,0.03)';
                ctx.fillRect(c * GRID_W + 2, GROUND_Y + 2, GRID_W - 4, H - GROUND_Y - 4);
            }
        }

        function drawFires() {
            for (let c = 0; c < COLS; c++) {
                const fire = state.grid[c].fire;
                if (fire <= 0) continue;
                const cx = c * GRID_W + GRID_W / 2;
                const intensity = Math.min(1.5, fire);
                const gr = ctx.createRadialGradient(cx, GROUND_Y + 5, 0, cx, GROUND_Y + 5, GRID_W * 0.7 * intensity);
                gr.addColorStop(0, `rgba(255,160,0,${0.4 * intensity})`);
                gr.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = gr;
                ctx.fillRect(c * GRID_W, GROUND_Y - 20, GRID_W, 80);
                const numFlames = 3 + Math.floor(intensity);
                for (let fi = 0; fi < numFlames; fi++) {
                    const fxOff = (fi / (numFlames - 1) - 0.5) * GRID_W * 0.7;
                    const flicker = 0.8 + 0.2 * Math.sin(t * 10 + c * 2.1 + fi * 1.7);
                    const fh = (25 + fi * 8) * intensity * flicker;
                    drawFlameTongue(cx + fxOff, GROUND_Y + 8, fh, intensity);
                }
            }
        }

        function drawFlameTongue(x, baseY, h, intensity) {
            ctx.fillStyle = `rgba(255,${80 + Math.floor(intensity * 40)},0,0.85)`;
            ctx.beginPath();
            ctx.moveTo(x - 10 * intensity, baseY);
            ctx.bezierCurveTo(x - 8, baseY - h * 0.4, x - 4, baseY - h * 0.8, x, baseY - h);
            ctx.bezierCurveTo(x + 4, baseY - h * 0.8, x + 8, baseY - h * 0.4, x + 10 * intensity, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = `rgba(255,210,50,0.7)`;
            ctx.beginPath();
            ctx.moveTo(x - 5 * intensity, baseY);
            ctx.bezierCurveTo(x - 3, baseY - h * 0.3, x - 1, baseY - h * 0.7, x, baseY - h * 0.85);
            ctx.bezierCurveTo(x + 1, baseY - h * 0.7, x + 3, baseY - h * 0.3, x + 5 * intensity, baseY);
            ctx.closePath();
            ctx.fill();
        }

        function drawFallers() {
            for (const f of state.fallers) {
                if (f.state === 'done') continue;
                const x = f.x, y = f.y;
                if (f.type === 'person') {
                    drawFallingPerson(x, y, f);
                } else if (f.type === 'debris') {
                    drawDebris(x, y, f, false);
                } else {
                    drawDebris(x, y, f, true);
                }
                const dist = GROUND_Y - y;
                const shadowAlpha = Math.max(0, Math.min(0.4, 1 - (dist / (GROUND_Y - 70))));
                const shadowW = Math.max(4, 40 * (1 - dist / (GROUND_Y - 70)));
                ctx.fillStyle = `rgba(0,0,0,${shadowAlpha * 0.4})`;
                ctx.beginPath();
                ctx.ellipse(f.x, GROUND_Y + 4, shadowW / 2, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawFallingPerson(x, y, f) {
            const armSwing = Math.sin(t * 6 + f.id) * 0.6;
            ctx.fillStyle = '#88aacc';
            ctx.fillRect(x - 7, y - 10, 14, 20);
            ctx.fillStyle = '#f5c8a0';
            ctx.beginPath();
            ctx.arc(x, y - 16, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#443322';
            ctx.beginPath();
            ctx.ellipse(x, y - 21, 9, 5, 0, Math.PI, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(x - 3, y - 17, 1.5, 0, Math.PI * 2);
            ctx.arc(x + 3, y - 17, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#cc6666';
            ctx.beginPath();
            ctx.ellipse(x, y - 13, 2.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#88aacc';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - 7, y - 6);
            ctx.lineTo(x - 18, y - 16 + armSwing * 12);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 7, y - 6);
            ctx.lineTo(x + 18, y - 16 - armSwing * 12);
            ctx.stroke();
            ctx.strokeStyle = '#334466';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(x - 4, y + 10); ctx.lineTo(x - 6, y + 22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 4, y + 10); ctx.lineTo(x + 6, y + 22);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x - 28, y - 36, 56, 14);
            ctx.fillStyle = '#88ccff';
            ctx.font = 'bold 9px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SEGÍTSÉG!', x, y - 26);
        }

        function drawDebris(x, y, f, explosive) {
            if (f.state === 'primed') {
                const pulse = 0.5 + 0.5 * Math.sin(t * (8 + f.timer < 0.5 ? 20 : 6));
                ctx.fillStyle = `rgba(255,60,0,${pulse * 0.3})`;
                ctx.beginPath();
                ctx.arc(x, y, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`BUMM ${f.timer.toFixed(1)}mp`, x, y - 28);
                ctx.fillText('⚠ HÁTRA!', x, y - 16);
            }
            if (f.state === 'exploding') {
                const pct = f.timer / 0.6;
                const er = (1 - pct) * 100;
                ctx.fillStyle = `rgba(255,200,50,${pct * 0.8})`;
                ctx.beginPath();
                ctx.arc(x, y, er, 0, Math.PI * 2);
                ctx.fill();
                return;
            }
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(t * 1.5 + f.id);
            if (explosive) {
                ctx.fillStyle = '#cc2200';
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(-12, -16, 24, 32, 4) : ctx.rect(-12, -16, 24, 32);
                ctx.fill();
                for (let s = 0; s < 3; s++) {
                    ctx.fillStyle = s % 2 === 0 ? '#ff4400' : '#ffcc00';
                    ctx.fillRect(-12, -16 + s * 10, 24, 8);
                }
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-12, -16, 5, 32);
                const sparkAlpha = 0.5 + 0.5 * Math.sin(t * 15);
                ctx.fillStyle = `rgba(255,220,0,${sparkAlpha})`;
                ctx.beginPath();
                ctx.arc(12, -12, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.rotate(-t * 1.5 - f.id);
                ctx.fillStyle = '#ffdd44';
                ctx.font = 'bold 8px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('💥', 0, 32);
            } else {
                ctx.fillStyle = '#553322';
                ctx.beginPath();
                ctx.moveTo(-14, -10); ctx.lineTo(14, -6);
                ctx.lineTo(10, 14); ctx.lineTo(-10, 12); ctx.lineTo(-14, -10);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#6a4430';
                ctx.beginPath();
                ctx.moveTo(-6, -10); ctx.lineTo(8, -8); ctx.lineTo(6, 0); ctx.lineTo(-4, 0);
                ctx.closePath();
                ctx.fill();
                ctx.rotate(-t * 1.5 - f.id);
                for (let fi = 0; fi < 2; fi++) {
                    drawFlameTongue(fi === 0 ? -6 : 6, -12, 12, 0.8);
                }
            }
            ctx.restore();
        }

        function drawPlayer() {
            const p = state.player;
            const x = p.x;
            const y = PLAYER_Y;
            const extActive = keys['e'] || keys['E'];
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#111';
            ctx.fillRect(-13, -4, 12, 8);
            ctx.fillRect(2, -4, 12, 8);
            ctx.fillStyle = '#223366';
            ctx.fillRect(-11, -22, 10, 18);
            ctx.fillRect(2, -22, 10, 18);
            ctx.fillStyle = '#cc2200';
            ctx.fillRect(-14, -48, 28, 26);
            ctx.fillStyle = '#ffdd44';
            ctx.fillRect(-14, -36, 28, 4);
            ctx.fillRect(-14, -28, 28, 3);
            const armSwing = extActive ? Math.sin(t * 8) * 3 : 0;
            ctx.fillStyle = '#cc2200';
            ctx.fillRect(-22, -46 + armSwing, 10, 20);
            ctx.fillRect(13, -46 - armSwing, 10, 20);
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-17, -28 + armSwing, 5, 0, Math.PI * 2);
            ctx.arc(18, -28 - armSwing, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f5c8a0';
            ctx.beginPath();
            ctx.arc(0, -60, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(-4, -62, 1.5, 0, Math.PI * 2);
            ctx.arc(4, -62, 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#553322';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-4, -55); ctx.lineTo(4, -55);
            ctx.stroke();
            ctx.fillStyle = '#dd2200';
            ctx.beginPath();
            ctx.ellipse(0, -68, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(0, -70, 14, 12, 0, Math.PI, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(120,160,200,0.6)';
            ctx.beginPath();
            ctx.ellipse(7, -67, 8, 4, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffdd44';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, -70, 11, Math.PI + 0.4, Math.PI * 2 - 0.4);
            ctx.stroke();
            ctx.fillStyle = '#cc0000';
            ctx.fillRect(-22, -50, 10, 22);
            ctx.fillStyle = '#eeeeee';
            ctx.fillRect(-22, -42, 10, 5);
            ctx.fillStyle = '#aaa';
            ctx.fillRect(-24, -52, 6, 4);
            if (extActive) {
                ctx.fillStyle = 'rgba(100,200,255,0.3)';
                ctx.beginPath();
                ctx.arc(0, -30, 30, 0, Math.PI * 2);
                ctx.fill();
                for (let i = 0; i < 3; i++) {
                    ctx.fillStyle = `rgba(100,180,255,${0.4 - i * 0.1})`;
                    ctx.beginPath();
                    ctx.arc(-22 + Math.sin(t * 8 + i) * 4, -35 - i * 8, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            ctx.fillStyle = `rgba(255,200,100,0.2)`;
            ctx.beginPath();
            ctx.ellipse(x, PLAYER_Y + 4, 18, 5, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawParticles() {
            for (const p of state.particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.col + alpha + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawHUD() {
            if (state.flashMsg && state.flashTimer > 0) {
                const a = Math.min(1, state.flashTimer);
                ctx.fillStyle = `rgba(0,0,0,${a * 0.65})`;
                ctx.fillRect(W / 2 - 130, H / 2 - 80, 260, 44);
                ctx.globalAlpha = a;
                ctx.fillStyle = state.flashColor || '#fff';
                ctx.font = 'bold 22px "Black Han Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(state.flashMsg, W / 2, H / 2 - 50);
                ctx.globalAlpha = 1;
            }
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(W - 160, H - 45, 155, 36);
            ctx.fillStyle = (keys['e'] || keys['E']) ? '#44bbff' : '#556';
            ctx.font = '13px monospace';
            ctx.textAlign = 'right';
            ctx.fillText((keys['e'] || keys['E']) ? '🔵 OLTÁS...' : '[ E ] OLTÁS', W - 8, H - 24);
            const pc = state.player.col;
            ctx.fillStyle = 'rgba(255,200,100,0.7)';
            ctx.beginPath();
            ctx.moveTo(pc * GRID_W + GRID_W / 2, GROUND_Y - 4);
            ctx.lineTo(pc * GRID_W + GRID_W / 2 - 8, GROUND_Y + 6);
            ctx.lineTo(pc * GRID_W + GRID_W / 2 + 8, GROUND_Y + 6);
            ctx.closePath();
            ctx.fill();
        }

        function loop(ts) {
            const dt = Math.min((ts - lastTs) / 1000, 0.05);
            lastTs = ts;
            if (gameActive && !state.gameOver) update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            document.getElementById('overlay').style.display = 'none';
            state = fresh();
            gameActive = true;
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
